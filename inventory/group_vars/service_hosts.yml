---
st_data_dir: "{{ homelab_data_dir }}/sillytavern"
sillytavern_port: 8000
sillytavern_openai_api_base_url: "http://llama-swap:8080/v1"
forgejo_port: 3003
forgejo_root_url: "https://forgejo.home/"
forgejo_populate_squash_comment_with_commit_messages: true
forgejo_lfs_start_server: true
forgejo_lfs_path: "/data/git/lfs"
openwebui_data_dir: "{{ homelab_data_dir }}/open-webui"
openwebui_port: 8081
openwebui_openai_api_base_url: "http://llama-swap:8080/v1"
openwebui_openai_api_base_urls: "http://llama-swap:8080/v1"
openwebui_openai_api_keys: "sk-dummy"
openwebui_enable_web_search: true
openwebui_web_search_engine: "searxng"
openwebui_searxng_query_url: "http://searxng:8080/search?q=<query>"
openwebui_web_loader_engine: "playwright"
openwebui_playwright_ws_uri: "ws://playwright:3000"

homepage_data_dir: "{{ homelab_data_dir }}/homepage"
homepage_port: 3002

glances_data_dir: "{{ homelab_data_dir }}/glances"
glances_port: 61208

searxng_data_dir: "{{ homelab_data_dir }}/searxng"
searxng_port: 8082
playwright_port: 3004

piclaw_data_dir: "{{ homelab_data_dir }}/piclaw"
piclaw_port: 8083

uptrace_data_dir: "{{ homelab_data_dir }}/uptrace"
uptrace_port: 14318
uptrace_image: "docker.io/uptrace/uptrace:2.0.3"
uptrace_autoupdate: disabled
uptrace_clickhouse_image: "docker.io/clickhouse/clickhouse-server:26.3"
uptrace_clickhouse_http_port: 8123
uptrace_postgres_image: "docker.io/library/postgres:17-alpine"
uptrace_redis_image: "docker.io/library/redis:6.2.2-alpine"
uptrace_otelcol_image: "docker.io/otel/opentelemetry-collector-contrib:0.123.0"
enable_uptrace_dashboards: true
uptrace_project_id: 1

adguardhome_data_dir: "{{ homelab_data_dir }}/adguardhome"
adguardhome_port: 8090
adguardhome_upstream_dns:
  - 9.9.9.9

