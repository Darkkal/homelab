---
model_dir: "{{ homelab_data_dir }}/models"
gpu_layers: 99
context_size: 32768
auto_unload_seconds: 600

# llama-swap configuration
llama_swap_config_dir: "{{ homelab_data_dir }}/llama-swap"
llama_swap_port: 8080

# SwarmUI configuration
swarmui_data_dir: "{{ homelab_data_dir }}/swarmui"
swarmui_port: 7801

# Wan2GP configuration
wan2gp_data_dir: "{{ homelab_data_dir }}/wan2gp"
wan2gp_port: 7860
wan2gp_image: "localhost/wan2gp:latest"

quadlet_no_block: true




