---
homelab_user_home: "/home/{{ ansible_facts['user_id'] }}"
quadlet_dir: "{{ homelab_user_home }}/.config/containers/systemd"
homelab_data_dir: "{{ homelab_user_home }}/homelab"

network_name: homelab.network
caddy_file_path: "{{ homelab_data_dir }}/caddy/Caddyfile"

forgejo_data_dir: "{{ homelab_data_dir }}/forgejo"
forgejo_admin_user: "{{ vault_forgejo_admin_user | default('admin') }}"
forgejo_admin_password: "{{ vault_forgejo_admin_password | default('') }}"
forgejo_admin_email: "{{ vault_forgejo_admin_email | default('admin@homelab.local') }}"
forgejo_api_token: "{{ vault_forgejo_api_token | default('') }}"

sillytavern_user: "{{ vault_sillytavern_user | default('admin') }}"
sillytavern_password: "{{ vault_sillytavern_password | default('') }}"
sillytavern_api_key: "{{ vault_sillytavern_api_key | default('') }}"

hermes_admin_user: "{{ vault_hermes_admin_user | default('admin') }}"
hermes_admin_password: "{{ vault_hermes_admin_password | default('admin') }}"
hermes_api_server_key: "{{ vault_hermes_api_server_key | default(lookup('password', homelab_data_dir + '/.hermes_api_key length=64 chars=hexdigits')) }}"

glances_username: "{{ vault_glances_username | default('glances') }}"
glances_password: "{{ vault_glances_password | default('') }}"

searxng_secret_key: "{{ vault_searxng_secret_key | default(lookup('password', homelab_data_dir + '/.searxng_secret_key length=64 chars=hexdigits')) }}"

# LAN subnet for firewall rich rules (HTTP port 80 & mDNS port 5353)
lan_subnet: "{{ host_lan_subnet | default(ansible_facts['default_ipv4']['network'] + '/24') }}"

# Podman container auto-update configuration
enable_podman_auto_update: true
podman_auto_update_schedule: "weekly"

