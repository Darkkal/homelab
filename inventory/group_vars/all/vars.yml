---
homelab_user_home: "/home/{{ ansible_facts['user_id'] }}"
quadlet_dir: "{{ homelab_user_home }}/.config/containers/systemd"
homelab_data_dir: "{{ homelab_user_home }}/homelab"

network_name: homelab.network
caddy_data_dir: "{{ homelab_data_dir }}/caddy"
caddy_file_path: "{{ caddy_data_dir }}/Caddyfile"

forgejo_data_dir: "{{ homelab_data_dir }}/forgejo"
forgejo_admin_user: "{{ vault_forgejo_admin_user | default('admin') }}"
forgejo_admin_password: "{{ vault_forgejo_admin_password | default('') }}"
forgejo_admin_email: "{{ vault_forgejo_admin_email | default('admin@homelab.local') }}"
forgejo_api_token: "{{ vault_forgejo_api_token_homepage | default(vault_forgejo_api_token | default('')) }}"

sillytavern_api_key: "{{ vault_sillytavern_api_key | default('') }}"

# Forgejo dispatcher API tokens (issue piclaw-horde/piclaw-scripts#1).
# Each PiClaw role gets its own Forgejo account/token; repo-level access is
# controlled by piclaw-horde organization teams, not token scoping.
# FORGEJO_TOKEN (below) keeps working as the planner key for backward
# compatibility with existing scripts.
piclaw_forgejo_api_token: "{{ vault_forgejo_api_token_planner | default('') }}"
forgejo_worker_api_token: "{{ vault_forgejo_api_token_piclaw_worker | default('') }}"
forgejo_reviewer_api_token: "{{ vault_forgejo_api_token_piclaw_reviewer | default('') }}"
piclaw_github_api_token: "{{ vault_github_api_token_piclaw | default('') }}"
piclaw_api_token: "{{ vault_piclaw_api_token | default(lookup('password', homelab_data_dir + '/.piclaw_api_token length=64 chars=hexdigits')) }}"

glances_username: "{{ vault_glances_username | default('glances') }}"
glances_password: "{{ vault_glances_password | default('') }}"

# AdGuard Home DNS server & ad blocker (web UI credentials; auto-generated unless provided in vault)
adguardhome_username: "{{ vault_adguard_username | default('admin') }}"
adguardhome_password: "{{ vault_adguard_password | default(lookup('password', homelab_data_dir + '/.adguardhome_password length=16 chars=ascii_lowercase,digits')) }}"

searxng_secret_key: "{{ vault_searxng_secret_key | default(lookup('password', homelab_data_dir + '/.searxng_secret_key length=64 chars=hexdigits')) }}"

# Uptrace observability secrets (auto-generated unless provided in vault)
uptrace_admin_email: "{{ vault_uptrace_admin_email | default('admin@homelab.local') }}"
uptrace_admin_password: "{{ vault_uptrace_admin_password | default('') }}"
uptrace_project_token: "{{ vault_uptrace_project_token | default(lookup('password', homelab_data_dir + '/.uptrace_project_token length=32 chars=hexdigits')) }}"
uptrace_secret: "{{ lookup('password', homelab_data_dir + '/.uptrace_secret length=64 chars=hexdigits') }}"
uptrace_pg_password: "{{ lookup('password', homelab_data_dir + '/.uptrace_pg_password length=32 chars=hexdigits') }}"
uptrace_ch_password: "{{ lookup('password', homelab_data_dir + '/.uptrace_ch_password length=32 chars=hexdigits') }}"

# Data retention (ClickHouse TTL)
uptrace_retention_traces: "7 DAY"
uptrace_retention_metrics: "30 DAY"
uptrace_retention_logs: "7 DAY"

# LAN subnet for firewall rich rules (HTTP port 80, HTTPS port 443 & DNS port 53)
lan_subnet: "{{ host_lan_subnet | default(ansible_facts['default_ipv4']['network'] + '/24') }}"

# Podman container auto-update configuration
enable_podman_auto_update: true
podman_auto_update_schedule: "Tue *-*-* 04:00:00"
