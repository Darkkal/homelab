- name: Deploy SillyTavern configuration file
  ansible.builtin.template:
    src: sillytavern_config.yaml.j2
    dest: "{{ st_data_dir }}/config/config.yaml"
    mode: "0644"
  when: "'sillytavern' in quadlet_services"
  notify: Restart sillytavern service

- name: Deploy llama-swap configuration file
  ansible.builtin.template:
    src: llama_swap_config.yaml.j2
    dest: "{{ llama_swap_config_dir }}/config.yaml"
    mode: "0644"
  when: "'llama-swap' in quadlet_services"
  notify: Restart llama-swap service

- name: Deploy SearXNG configuration file
  ansible.builtin.template:
    src: searxng_settings.yml.j2
    dest: "{{ searxng_data_dir }}/settings.yml"
    mode: "0644"
  when: "'searxng' in quadlet_services"
  notify: Restart searxng service

- name: Deploy Glances password file
  ansible.builtin.template:
    src: glances.pwd.j2
    dest: "{{ glances_data_dir }}/{{ glances_username }}.pwd"
    mode: "0600"
  when:
    - "'glances' in quadlet_services"
    - glances_password != ''
  notify: Restart glances service

- name: Deploy Homepage configuration files
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ homepage_data_dir }}/config/{{ item | regex_replace('^homepage\\.(.*)\\.j2$', '\\1') }}"
    mode: "0644"
  loop:
    - homepage.settings.yaml.j2
    - homepage.widgets.yaml.j2
    - homepage.bookmarks.yaml.j2
    - homepage.docker.yaml.j2
    - homepage.services.yaml.j2
    - homepage.custom.css.j2
    - homepage.custom.js.j2
  when: "'homepage' in quadlet_services"
  notify: Restart homepage service

- name: Deploy Open WebUI database sync script
  ansible.builtin.template:
    src: sync_openwebui_db.py.j2
    dest: "{{ openwebui_data_dir }}/sync_openwebui_db.py"
    mode: "0755"
  when: "'open-webui' in quadlet_services"

- name: Sync Open WebUI SQLite configuration
  ansible.builtin.command:
    cmd: "python3 {{ openwebui_data_dir }}/sync_openwebui_db.py"
  when: "'open-webui' in quadlet_services"
  register: openwebui_db_sync_result
  changed_when: "'Updated' in openwebui_db_sync_result.stdout"
  notify: Restart open-webui service

- name: Deploy SwarmUI Quadlet build definition
  ansible.builtin.template:
    src: swarmui.build.j2
    dest: "{{ quadlet_dir }}/swarmui.build"
    mode: "0644"
  when: "'swarmui' in quadlet_services"
  notify: Reload user systemd

- name: Deploy Quadlet container definitions
  ansible.builtin.template:
    src: "{{ item }}.container.j2"
    dest: "{{ quadlet_dir }}/{{ item }}.container"
    mode: "0644"
  loop: "{{ quadlet_services }}"
  register: quadlet_deploy_results
  notify: Reload user systemd

- name: Flush handlers to reload systemd if templates changed
  ansible.builtin.meta: flush_handlers

- name: Restart updated container services
  ansible.builtin.systemd:
    name: "{{ item.item }}.service"
    state: restarted
    no_block: "{{ quadlet_no_block | default(false) }}"
    scope: user
  loop: "{{ quadlet_deploy_results.results }}"
  when: item.changed

- name: Reload caddy service if container services updated
  ansible.builtin.systemd:
    name: caddy.service
    state: restarted
    scope: user
  when:
    - quadlet_deploy_results.results | selectattr('changed') | list | length > 0
    - "'caddy' not in quadlet_services"
  failed_when: false

- name: Enable and start Quadlet container services
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    enabled: true
    state: started
    no_block: "{{ quadlet_no_block | default(false) }}"
    scope: user
  loop: "{{ quadlet_services }}"
