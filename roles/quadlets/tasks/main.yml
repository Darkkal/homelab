- name: Deploy SillyTavern configuration file
  ansible.builtin.template:
    src: sillytavern_config.yaml.j2
    dest: "{{ st_data_dir }}/config/config.yaml"
    mode: '0644'
  when: "'sillytavern' in quadlet_services"
  notify: Restart sillytavern service

- name: Deploy llama-swap configuration file
  ansible.builtin.template:
    src: llama_swap_config.yaml.j2
    dest: "{{ llama_swap_config_dir }}/config.yaml"
    mode: '0644'
  when: "'llama-swap' in quadlet_services"
  notify: Restart llama-swap service

- name: Deploy Hermes configuration file
  ansible.builtin.template:
    src: hermes_config.yaml.j2
    dest: "{{ hermes_data_dir }}/config.yaml"
    mode: '0644'
    force: false
  when: "'hermes-agent' in quadlet_services"
  become: true
  notify: Restart hermes-agent service

- name: Sync Open WebUI OpenAI connections in SQLite database
  ansible.builtin.command:
    cmd: >
      python3 -c "import sqlite3, json, os; db_path = '{{ openwebui_data_dir }}/webui.db'; (os.path.exists(db_path) and (conn := sqlite3.connect(db_path)) and (cur := conn.cursor()) and (cur.execute(\"SELECT name FROM sqlite_master WHERE type='table' AND name='config'\").fetchone()) and (base_urls := '{{ openwebui_openai_api_base_urls | default('http://llama-swap:8080/v1;http://hermes:8642/v1') }}'.split(';')) and (api_keys := '{{ openwebui_openai_api_keys | default('sk-dummy;' + hermes_api_server_key) }}'.split(';')) and (api_configs := {str(i): {'enable': True, 'tags': [], 'prefix_id': '', 'model_ids': [], 'connection_type': 'external', 'auth_type': 'bearer', 'passthrough_params': []} for i in range(len(base_urls))}) and cur.execute('INSERT OR REPLACE INTO config (key, value) VALUES (?, ?)', ('openai.api_base_urls', json.dumps(base_urls))) and cur.execute('INSERT OR REPLACE INTO config (key, value) VALUES (?, ?)', ('openai.api_keys', json.dumps(api_keys))) and cur.execute('INSERT OR REPLACE INTO config (key, value) VALUES (?, ?)', ('openai.api_configs', json.dumps(api_configs))) and conn.commit() and conn.close())"
  when: "'open-webui' in quadlet_services"
  changed_when: false

- name: Deploy SwarmUI Quadlet build definition
  ansible.builtin.template:
    src: swarmui.build.j2
    dest: "{{ quadlet_dir }}/swarmui.build"
    mode: '0644'
  when: "'swarmui' in quadlet_services"
  notify: Reload user systemd

- name: Deploy Wan2GP Dockerfile template
  ansible.builtin.template:
    src: wan2gp.Dockerfile.j2
    dest: "{{ quadlet_dir }}/wan2gp.Dockerfile"
    mode: '0644'
  when: "'wan2gp' in quadlet_services"
  notify: Reload user systemd

- name: Deploy Wan2GP Quadlet build definition
  ansible.builtin.template:
    src: wan2gp.build.j2
    dest: "{{ quadlet_dir }}/wan2gp.build"
    mode: '0644'
  when: "'wan2gp' in quadlet_services"
  notify: Reload user systemd

- name: Deploy Quadlet container definitions
  ansible.builtin.template:
    src: "{{ item }}.container.j2"
    dest: "{{ quadlet_dir }}/{{ item }}.container"
    mode: '0644'
  loop: "{{ quadlet_services }}"
  register: quadlet_deploy_results
  notify: Reload user systemd

- name: Flush handlers to reload systemd if templates changed
  ansible.builtin.meta: flush_handlers

- name: Restart updated container services
  ansible.builtin.systemd:
    name: "{{ item.item }}.service"
    state: restarted
    no_block: "{{ quadlet_no_block | default(false) }}"
    scope: user
  loop: "{{ quadlet_deploy_results.results }}"
  when: item.changed

- name: Reload caddy service if container services updated
  ansible.builtin.systemd:
    name: caddy.service
    state: restarted
    scope: user
  when:
    - quadlet_deploy_results.results | selectattr('changed') | list | length > 0
    - "'caddy' not in quadlet_services"
  failed_when: false

- name: Enable and start Quadlet container services
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    enabled: true
    state: started
    no_block: "{{ quadlet_no_block | default(false) }}"
    scope: user
  loop: "{{ quadlet_services }}"



