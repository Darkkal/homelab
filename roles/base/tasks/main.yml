---
- name: Ensure common homelab directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ homelab_data_dir }}"
    - "{{ homelab_data_dir }}/bin"
    - "{{ quadlet_dir }}"
    - "{{ homelab_user_home }}/.config/containers/registries.conf.d"
    - "{{ homelab_user_home }}/.config/systemd/user/podman-auto-update.timer.d"
    - "{{ homelab_user_home }}/.config/systemd/user/podman-auto-update.service.d"

- name: Ensure service host data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ homelab_data_dir }}/sillytavern"
    - "{{ homelab_data_dir }}/sillytavern/config"
    - "{{ homelab_data_dir }}/sillytavern/data"
    - "{{ homelab_data_dir }}/sillytavern/plugins"
    - "{{ homelab_data_dir }}/sillytavern/extensions"
    - "{{ homelab_data_dir }}/forgejo"
    - "{{ homelab_data_dir }}/caddy"
    - "{{ homelab_data_dir }}/caddy/data"
    - "{{ homelab_data_dir }}/open-webui"
    - "{{ homelab_data_dir }}/homepage"
    - "{{ homelab_data_dir }}/homepage/config"
    - "{{ homelab_data_dir }}/homepage/images"
    - "{{ homelab_data_dir }}/glances"
    - "{{ homelab_data_dir }}/searxng"
    - "{{ homelab_data_dir }}/piclaw"
    - "{{ homelab_data_dir }}/piclaw/config"
    - "{{ homelab_data_dir }}/piclaw/workspace"
    - "{{ homelab_data_dir }}/uptrace"
    - "{{ homelab_data_dir }}/uptrace/ch"
    - "{{ homelab_data_dir }}/uptrace/pg"
    - "{{ homelab_data_dir }}/uptrace/ch-config"
    - "{{ homelab_data_dir }}/adguardhome"
    - "{{ homelab_data_dir }}/adguardhome/conf"
    - "{{ homelab_data_dir }}/adguardhome/work"
  when: "'service_hosts' in group_names"

- name: Ensure inference host data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ homelab_data_dir }}/models"
    - "{{ homelab_data_dir }}/llama-swap"
    - "{{ homelab_data_dir }}/swarmui"
    - "{{ homelab_data_dir }}/swarmui/Data"
    - "{{ homelab_data_dir }}/swarmui/Models"
    - "{{ homelab_data_dir }}/swarmui/Output"
    - "{{ homelab_data_dir }}/swarmui/dlbackend"
    - "{{ homelab_data_dir }}/swarmui/DLNodes"
  when: "'inference_hosts' in group_names"

- name: Deploy Podman short-name resolution aliases configuration
  ansible.builtin.copy:
    content: |
      [aliases]
        "nvidia/cuda" = "docker.io/nvidia/cuda"
    dest: "~/.config/containers/registries.conf.d/00-shortnames.conf"
    mode: '0644'




- name: Allow rootless podman to bind low ports (port 53)
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '53'
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-rootless-ports.conf
  become: true

- name: Gather system service facts
  ansible.builtin.service_facts:

- name: Configure firewalld rules
  when:
    - "'firewalld.service' in ansible_facts.services"
    - "ansible_facts.services['firewalld.service'].state == 'running'"
  block:
    - name: Determine firewalld zone of the default LAN interface
      ansible.builtin.command: "firewall-cmd --get-zone-of-interface={{ ansible_default_ipv4.interface }}"
      register: firewalld_zone_result
      changed_when: false
      failed_when: false

    - name: Set firewalld target zone fact
      ansible.builtin.set_fact:
        firewalld_zone: "{{ firewalld_zone_result.stdout | default('') }}"

    - name: Fall back to public zone if interface zone detection failed
      ansible.builtin.set_fact:
        firewalld_zone: public
      when: firewalld_zone | length == 0

    - name: Allow Podman container subnet in firewalld
      ansible.posix.firewalld:
        zone: trusted
        source: "10.89.0.0/16"
        permanent: true
        immediate: true
        state: enabled
      become: true

    - name: Allow LAN access to HTTP (port 80) in firewalld
      ansible.posix.firewalld:
        zone: "{{ firewalld_zone }}"
        rich_rule: 'rule family="ipv4" source address="{{ lan_subnet }}" port port="80" protocol="tcp" accept'
        permanent: true
        immediate: true
        state: enabled
      become: true

    - name: Allow LAN access to HTTPS (port 443) in firewalld
      ansible.posix.firewalld:
        zone: "{{ firewalld_zone }}"
        rich_rule: 'rule family="ipv4" source address="{{ lan_subnet }}" port port="443" protocol="tcp" accept'
        permanent: true
        immediate: true
        state: enabled
      become: true

    - name: Allow LAN access to DNS (port 53) in firewalld
      ansible.posix.firewalld:
        zone: "{{ firewalld_zone }}"
        rich_rule: 'rule family="ipv4" source address="{{ lan_subnet }}" port port="53" protocol="tcp" accept'
        permanent: true
        immediate: true
        state: enabled
      become: true

    - name: Allow LAN access to DNS (port 53) over UDP in firewalld
      ansible.posix.firewalld:
        zone: "{{ firewalld_zone }}"
        rich_rule: 'rule family="ipv4" source address="{{ lan_subnet }}" port port="53" protocol="udp" accept'
        permanent: true
        immediate: true
        state: enabled
      become: true

- name: Configure UFW rules
  when:
    - "'ufw.service' in ansible_facts.services"
    - "ansible_facts.services['ufw.service'].state == 'running'"
  block:
    - name: Allow Podman container subnet in ufw
      community.general.ufw:
        rule: allow
        src: "10.89.0.0/16"
      become: true

    - name: Allow LAN access to HTTP (port 80) in ufw
      community.general.ufw:
        rule: allow
        from_ip: "{{ lan_subnet }}"
        port: '80'
        proto: tcp
      become: true

    - name: Allow LAN access to HTTPS (port 443) in ufw
      community.general.ufw:
        rule: allow
        from_ip: "{{ lan_subnet }}"
        port: '443'
        proto: tcp
      become: true

    - name: Allow LAN access to DNS (port 53) in ufw
      community.general.ufw:
        rule: allow
        from_ip: "{{ lan_subnet }}"
        port: '53'
        proto: tcp
      become: true

    - name: Allow LAN access to DNS (port 53) over UDP in ufw
      community.general.ufw:
        rule: allow
        from_ip: "{{ lan_subnet }}"
        port: '53'
        proto: udp
      become: true

- name: Check if user lingering is enabled
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ ansible_facts['user_id'] }}"
  register: linger_file

- name: Enable systemd user lingering
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ansible_facts['user_id'] }}"
  become: true
  when: not linger_file.stat.exists

- name: Deploy static Quadlet network files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ quadlet_dir }}/{{ item }}"
    mode: '0644'
  loop:
    - homelab.network
  notify: Reload user systemd

- name: Deploy Podman auto-update timer schedule override
  ansible.builtin.template:
    src: podman-auto-update.timer.override.conf.j2
    dest: "{{ homelab_user_home }}/.config/systemd/user/podman-auto-update.timer.d/override.conf"
    mode: '0644'
  notify: Reload user systemd

- name: Deploy homelab auto-rebuild git SHA pre-check script
  ansible.builtin.template:
    src: homelab-auto-rebuild-check.sh.j2
    dest: "{{ homelab_data_dir }}/bin/homelab-auto-rebuild-check.sh"
    mode: '0755'

- name: Deploy Podman auto-update service local rebuild override
  ansible.builtin.template:
    src: podman-auto-update.service.override.conf.j2
    dest: "{{ homelab_user_home }}/.config/systemd/user/podman-auto-update.service.d/override.conf"
    mode: '0644'
  notify: Reload user systemd

- name: Manage Podman auto-update systemd user timer
  ansible.builtin.systemd:
    name: podman-auto-update.timer
    state: "{{ 'started' if (enable_podman_auto_update | default(true)) else 'stopped' }}"
    enabled: "{{ enable_podman_auto_update | default(true) }}"
    scope: user
