---
- name: Ensure homelab data and config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ homelab_data_dir }}"
    - "{{ homelab_data_dir }}/models"
    - "{{ homelab_data_dir }}/sillytavern"
    - "{{ homelab_data_dir }}/piclaw/home"
    - "{{ homelab_data_dir }}/piclaw/workspace"
    - "{{ homelab_data_dir }}/forgejo"
    - "{{ homelab_data_dir }}/caddy"
    - "{{ quadlet_dir }}"

- name: Allow rootless podman to bind low ports (port 80)
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '80'
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-rootless-ports.conf
  become: true

- name: Allow Podman container traffic in firewalld
  ansible.posix.firewalld:
    zone: trusted
    interface: "podman+"
    permanent: true
    immediate: true
    state: enabled
  become: true
  ignore_errors: true

- name: Allow Podman container subnet in firewalld
  ansible.posix.firewalld:
    zone: trusted
    source: "10.89.0.0/16"
    permanent: true
    immediate: true
    state: enabled
  become: true
  ignore_errors: true

- name: Check if user lingering is enabled
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ ansible_facts['user_id'] }}"
  register: linger_file

- name: Enable systemd user lingering
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ansible_facts['user_id'] }}"
  become: true
  when: not linger_file.stat.exists

- name: Deploy static Quadlet network files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ quadlet_dir }}/{{ item }}"
    mode: '0644'
  loop:
    - homelab.network
