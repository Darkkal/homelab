---
- name: Stop and disable legacy Avahi alias units
  ansible.builtin.systemd:
    name: "avahi-alias@{{ item }}.service"
    enabled: false
    state: stopped
  loop: "{{ avahi_legacy_aliases }}"
  become: true
  failed_when: false

- name: Remove legacy Avahi alias systemd unit
  ansible.builtin.file:
    path: /etc/systemd/system/avahi-alias@.service
    state: absent
  become: true
  notify: Reload system systemd

- name: Flush systemd reload after removing legacy unit
  ansible.builtin.meta: flush_handlers

- name: Remove legacy Avahi tools package
  ansible.builtin.dnf:
    name: avahi-tools
    state: absent
  become: true

- name: Remove legacy mDNS firewalld rule
  ansible.posix.firewalld:
    zone: "{{ firewalld_zone }}"
    rich_rule: 'rule family="ipv4" source address="{{ lan_subnet }}" port port="5353" protocol="udp" accept'
    permanent: true
    immediate: true
    state: disabled
  become: true
  failed_when: false

- name: Remove legacy mDNS UFW rule
  community.general.ufw:
    rule: allow
    delete: true
    from_ip: "{{ lan_subnet }}"
    port: '5353'
    proto: udp
  become: true
  when:
    - "'ufw.service' in ansible_facts.services"
    - "ansible_facts.services['ufw.service'].state == 'running'"
  failed_when: false
