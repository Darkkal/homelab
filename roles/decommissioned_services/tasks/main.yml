---
- name: Validate decommissioned service tombstones
  ansible.builtin.assert:
    that:
      - homelab_decommissioned_services is sequence and homelab_decommissioned_services is not string
      - item is mapping
      - item.name is string and item.name is match('^[a-z][a-z0-9_-]*$')
      - (item.keys() | list) | difference(['name', 'unit_globs', 'unit_files', 'firewalld_rules', 'ufw_rules']) | length == 0
      - item.unit_globs is sequence and item.unit_globs is not string and item.unit_globs | length > 0
      - item.unit_files is sequence and item.unit_files is not string
      - item.firewalld_rules is sequence and item.firewalld_rules is not string
      - item.ufw_rules is sequence and item.ufw_rules is not string
      - (item.unit_files | select('match', '^/etc/systemd/system/[A-Za-z0-9_.@%:-]+$') | list | length) == (item.unit_files | length)
      - (item.unit_globs | select('match', '^[a-zA-Z0-9_.@*:-]+$') | list | length) == (item.unit_globs | length)
      - (item.firewalld_rules | selectattr('keys', 'defined') | list | length) == (item.firewalld_rules | length)
      - (item.ufw_rules | selectattr('keys', 'defined') | list | length) == (item.ufw_rules | length)
      - (item.firewalld_rules | selectattr('rich_rule', 'defined') | list | length) == (item.firewalld_rules | length)
      - (item.ufw_rules | selectattr('from_ip', 'defined') | list | length) == (item.ufw_rules | length)
      - (item.ufw_rules | selectattr('port', 'defined') | list | length) == (item.ufw_rules | length)
      - (item.ufw_rules | selectattr('proto', 'defined') | list | length) == (item.ufw_rules | length)
      - (item.ufw_rules | selectattr('from_ip', 'string') | list | length) == (item.ufw_rules | length)
      - (item.ufw_rules | selectattr('port', 'string') | list | length) == (item.ufw_rules | length)
      - (item.ufw_rules | selectattr('proto', 'string') | list | length) == (item.ufw_rules | length)
      - (item.firewalld_rules | selectattr('rich_rule', 'string') | list | length) == (item.firewalld_rules | length)
    fail_msg: "Invalid homelab_decommissioned_services tombstone: {{ item }}"
  loop: "{{ homelab_decommissioned_services }}"

- name: Reject active and decommissioned service conflicts
  ansible.builtin.assert:
    that: "(homelab_active_services | default([])) | intersect(homelab_decommissioned_services | map(attribute='name') | list) | length == 0"
    fail_msg: "A service cannot be both active and decommissioned"

- name: Discover installed legacy service units
  ansible.builtin.shell: >-
    systemctl list-unit-files --no-legend --plain {{ item.unit_globs | map('quote') | join(' ') }}
    | awk '{print $1}'
  register: discovered_units
  loop: "{{ homelab_decommissioned_services }}"
  changed_when: false
  become: true
  failed_when: discovered_units.rc != 0

- name: Stop and disable discovered legacy units
  ansible.builtin.systemd:
    name: "{{ unit }}"
    state: stopped
    enabled: false
  loop: "{{ discovered_units.results | map(attribute='stdout_lines') | flatten }}"
  loop_control:
    loop_var: unit
  become: true

- name: Remove legacy systemd unit files
  ansible.builtin.file:
    path: "{{ unit_file }}"
    state: absent
  loop: "{{ homelab_decommissioned_services | map(attribute='unit_files') | flatten }}"
  loop_control:
    loop_var: unit_file
  become: true
  notify: Reload system systemd

- name: Discover firewalld zones
  ansible.builtin.command: firewall-cmd --get-zones
  register: firewalld_zones
  changed_when: false
  become: true
  when: "ansible_facts.services['firewalld.service'] is defined and ansible_facts.services['firewalld.service'].state == 'running'"

- name: Remove legacy firewalld rules from every zone
  ansible.posix.firewalld:
    zone: "{{ zone }}"
    rich_rule: "{{ rule.rich_rule }}"
    permanent: true
    immediate: true
    state: disabled
  loop: "{{ (homelab_decommissioned_services | map(attribute='firewalld_rules') | flatten) | product((firewalld_zones.stdout | default('')).split()) | list }}"
  loop_control:
    loop_var: firewall_rule
  vars:
    rule: "{{ firewall_rule.0 }}"
    zone: "{{ firewall_rule.1 }}"
  become: true
  when: firewalld_zones is not skipped

- name: Remove legacy UFW rules
  community.general.ufw:
    rule: allow
    delete: true
    from_ip: "{{ rule.from_ip }}"
    port: "{{ rule.port }}"
    proto: "{{ rule.proto }}"
  loop: "{{ homelab_decommissioned_services | map(attribute='ufw_rules') | flatten }}"
  loop_control:
    loop_var: rule
  become: true
  when: "ansible_facts.services['ufw.service'] is defined and ansible_facts.services['ufw.service'].state == 'running'"
