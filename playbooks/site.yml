---
- name: Validate release-coupled system lifecycle policy on every host
  hosts: all
  gather_facts: false
  strategy: linear
  any_errors_fatal: true
  vars_files:
    - ./vars/system_lifecycle.yml
  pre_tasks:
    - name: Resolve the LAN fallback from bounded fresh networking facts
      ansible.builtin.import_role:
        name: decommissioned_services
        tasks_from: network
    - name: Admit lifecycle context without discovery or convergence
      ansible.builtin.import_role:
        name: decommissioned_services
        tasks_from: validate
      vars:
        homelab_active_system_services: "{{ homelab_lifecycle_source.active_system_services }}"
        homelab_decommissioned_services: "{{ homelab_lifecycle_source.retired_system_services }}"
        homelab_preserved_system_units: "{{ homelab_lifecycle_source.preserved_system_units }}"

- name: Configure base system for all homelab hosts
  hosts: all
  roles:
    - base

- name: Decommission legacy Avahi state
  hosts: all
  any_errors_fatal: true
  vars_files:
    - ./vars/system_lifecycle.yml
  roles:
    - role: decommissioned_services
      vars:
        homelab_active_system_services: "{{ homelab_lifecycle_source.active_system_services }}"
        homelab_decommissioned_services: "{{ homelab_lifecycle_source.retired_system_services }}"
        homelab_preserved_system_units: "{{ homelab_lifecycle_source.preserved_system_units }}"

- name: Configure NVIDIA runtime on inference hosts
  hosts: inference_hosts
  roles:
    - nvidia

- name: Deploy inference Quadlets
  hosts: inference_hosts
  roles:
    - role: quadlets
      vars:
        quadlet_services:
          - llama-swap
          - swarmui


- name: Deploy service Quadlets and supporting infrastructure
  hosts: service_hosts
  roles:
    - caddy
    - role: quadlets
      vars:
        quadlet_services:
          - sillytavern
          - forgejo
          - open-webui
          - searxng
          - playwright
          - homepage
          - glances
          - piclaw
          - adguardhome
          - uptrace-clickhouse
          - uptrace-postgres
          - uptrace-redis
          - uptrace
          - uptrace-otelcol
          - webgallery
          - hatchet-postgres
          - hatchet

- name: Deploy Caddy reverse proxy
  hosts: service_hosts
  roles:
    - role: quadlets
      vars:
        quadlet_services:
          - caddy

- name: Deploy Forgejo Actions runners
  hosts: forgejo_runner_hosts
  roles:
    - forgejo_runner
