---
- name: Configure base system for all homelab hosts
  hosts: all
  roles:
    - base

- name: Decommission legacy Avahi state
  hosts: all
  roles:
    - role: decommissioned_services
      vars:
        homelab_decommissioned_services:
          - name: avahi
            unit_globs:
              - 'avahi-alias@*.service'
            unit_files:
              - /etc/systemd/system/avahi-alias@.service
            firewalld_rules:
              - rich_rule: 'rule family="ipv4" source address="{{ lan_subnet }}" port port="5353" protocol="udp" accept'
            ufw_rules:
              - from_ip: "{{ lan_subnet }}"
                port: '5353'
                proto: udp

- name: Configure NVIDIA runtime on inference hosts
  hosts: inference_hosts
  roles:
    - nvidia

- name: Deploy inference Quadlets
  hosts: inference_hosts
  roles:
    - role: quadlets
      vars:
        quadlet_services:
          - llama-swap
          - swarmui


- name: Deploy service Quadlets and supporting infrastructure
  hosts: service_hosts
  roles:
    - caddy
    - role: quadlets
      vars:
        quadlet_services:
          - sillytavern
          - forgejo
          - open-webui
          - searxng
          - playwright
          - homepage
          - glances
          - piclaw
          - adguardhome
          - uptrace-clickhouse
          - uptrace-postgres
          - uptrace-redis
          - uptrace
          - uptrace-otelcol

- name: Deploy Caddy reverse proxy
  hosts: service_hosts
  roles:
    - role: quadlets
      vars:
        quadlet_services:
          - caddy

- name: Deploy Forgejo Actions runners
  hosts: forgejo_runner_hosts
  roles:
    - forgejo_runner
