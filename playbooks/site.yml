---
- name: Configure base system for all homelab hosts
  hosts: all
  roles:
    - base

- name: Configure NVIDIA runtime on inference hosts
  hosts: inference_hosts
  roles:
    - nvidia

- name: Deploy inference Quadlets
  hosts: inference_hosts
  roles:
    - role: quadlets
      vars:
        quadlet_services:
          - llama-swap
          - swarmui


- name: Deploy service Quadlets and supporting infrastructure
  hosts: service_hosts
  roles:
    - avahi_decommission
    - caddy
    - role: quadlets
      vars:
        quadlet_services:
          - sillytavern
          - forgejo
          - open-webui
          - searxng
          - playwright
          - homepage
          - glances
          - piclaw
          - adguardhome
          - uptrace-clickhouse
          - uptrace-postgres
          - uptrace-redis
          - uptrace
          - uptrace-otelcol

- name: Deploy Caddy reverse proxy
  hosts: service_hosts
  roles:
    - role: quadlets
      vars:
        quadlet_services:
          - caddy

- name: Deploy Forgejo Actions runners
  hosts: forgejo_runner_hosts
  roles:
    - forgejo_runner
